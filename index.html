<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Napi Én</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Napi Én">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 18px;
  color: #b06b8f;
}

.screen { display: none; padding: 15px; }
.active { display: block; }

.card {
  background: white;
  padding: 15px;
  border-radius: 18px;
  margin-bottom: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

button {
  border: none;
  padding: 10px;
  border-radius: 12px;
  margin-top: 5px;
  background: #f3c6da;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #eee;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: white;
  border-top: 1px solid #eee;
}

.nav button {
  flex: 1;
  background: none;
  font-size: 18px;
}
.small { font-size: 12px; color: gray; }
</style>
</head>

<body>

<header>Napi Én 🌸</header>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="card">
    <h3>❤️ Kapcsolati nyugalom</h3>
    <button onclick="setCalm(true)">Ma nyugodt voltam</button>
    <button onclick="setCalm(false)">Ma ideges voltam</button>
    <p id="calmStatus"></p>
  </div>

  <div class="card">
    <h3>💪 Plank</h3>
    <input id="plank" placeholder="pl. 02:15"/>
    <button onclick="savePlank()">Mentés</button>
    <p id="plankList"></p>
  </div>
</div>

<!-- EMOTIONS -->
<div id="emotions" class="screen">
  <div class="card">
    <h3>🫧 Mentális súly</h3>
    <textarea id="weight"></textarea>
    <button onclick="saveWeight()">Mentés</button>
    <p id="weights"></p>
  </div>

  <div class="card">
    <h3>🌷 Én-ígéretek</h3>
    <textarea id="promise"></textarea>
    <button onclick="savePromise()">Mentés</button>
    <p id="promises"></p>
  </div>

  <div class="card">
    <h3>🌿 Belső időjárás</h3>
    <select id="weather">
      <option>☀️ nyugodt</option>
      <option>⛅ kicsit zavaros</option>
      <option>🌧️ stresszes</option>
      <option>🌪️ túlterhelt</option>
      <option>🌙 csendes</option>
    </select>
    <button onclick="saveWeather()">Mentés</button>
    <p id="weatherOut"></p>
  </div>
</div>

<!-- GARDEN -->
<div id="garden" class="screen">
  <div class="card">
    <h3>🌸 Nyugalom kertje</h3>
    <p id="gardenPoints"></p>
    <button onclick="addPoint()">+1 nyugodt nap pont</button>
  </div>
</div>

<!-- TIMELINE -->
<div id="timeline" class="screen">
  <div class="card">
    <h3>📖 Idővonal</h3>
    <textarea id="log"></textarea>
    <button onclick="saveLog()">Mentés</button>
    <p id="logs"></p>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="show('home')">🏠</button>
  <button onclick="show('emotions')">💖</button>
  <button onclick="show('garden')">🌸</button>
  <button onclick="show('timeline')">📖</button>
</div>

<script>
// NAV
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// DATA
let calm = JSON.parse(localStorage.getItem("calm")||"[]");
let planks = JSON.parse(localStorage.getItem("planks")||"[]");
let weights = JSON.parse(localStorage.getItem("weights")||"[]");
let promises = JSON.parse(localStorage.getItem("promises")||"[]");
let weather = JSON.parse(localStorage.getItem("weather")||"[]");
let logs = JSON.parse(localStorage.getItem("logs")||"[]");
let garden = parseInt(localStorage.getItem("garden")||"0");

// SAVE FUNCTIONS
function setCalm(v){
  calm.push(v);
  localStorage.setItem("calm", JSON.stringify(calm));
  document.getElementById("calmStatus").innerText = "Mentve 🌸";
}

function savePlank(){
  planks.push(document.getElementById("plank").value);
  localStorage.setItem("planks", JSON.stringify(planks));
  document.getElementById("plankList").innerText = planks.join(", ");
}

function saveWeight(){
  weights.push(document.getElementById("weight").value);
  localStorage.setItem("weights", JSON.stringify(weights));
  document.getElementById("weights").innerText = "Mentve";
}

function savePromise(){
  promises.push(document.getElementById("promise").value);
  localStorage.setItem("promises", JSON.stringify(promises));
  document.getElementById("promises").innerText = "Mentve";
}

function saveWeather(){
  weather.push(document.getElementById("weather").value);
  localStorage.setItem("weather", JSON.stringify(weather));
  document.getElementById("weatherOut").innerText = "Mentve";
}

function saveLog(){
  logs.push(document.getElementById("log").value);
  localStorage.setItem("logs", JSON.stringify(logs));
  document.getElementById("logs").innerText = "Mentve";
}

function addPoint(){
  garden++;
  localStorage.setItem("garden", garden);
  document.getElementById("gardenPoints").innerText = "Pontok: " + garden;
}

// INIT
document.getElementById("gardenPoints").innerText = "Pontok: " + garden;
</script>

</body>
</html>
