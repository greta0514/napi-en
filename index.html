<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Napi Én 🌸</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Napi Én">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff5fb;
  color: #4a2b3a;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 22px;
}

.page {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: white;
  border-top: 1px solid #ddd;
  padding: 10px 0;
}

.bottom-nav button {
  background: none;
  border: none;
  font-size: 14px;
}
input, textarea {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
}
</style>
</head>

<body>

<header>Napi Én 🌸</header>

<!-- 🏠 KEZDŐLAP -->
<div id="home" class="page active">
  <h2>Mai napod 🌸</h2>
  <p>Írd be a mai gondolataid:</p>
  <textarea id="todayNote"></textarea>
  <button onclick="saveNote()">Mentés</button>
</div>

<!-- 💪 EGÉSZSÉG -->
<div id="health" class="page">
  <h2>💪 Egészség</h2>

  <h3>Plank (perc:másodperc)</h3>
  <input id="plank" placeholder="pl. 2:15"/>

  <h3>Víz (pohár)</h3>
  <input id="water" placeholder="pl. 6"/>

  <h3>Alvás (óra)</h3>
  <input id="sleep" placeholder="pl. 7"/>

  <h3>Heti étrend jegyzet</h3>
  <textarea id="diet"></textarea>

  <button onclick="saveHealth()">Mentés</button>
</div>

<!-- 💖 ÉRZELMEK -->
<div id="emotions" class="page">
  <h2>💖 Érzelmek</h2>
  <textarea id="emotionNote" placeholder="Belső időjárás, gondolatok..."></textarea>
  <button onclick="saveEmotions()">Mentés</button>
</div>

<!-- 🌸 KERT -->
<div id="garden" class="page">
  <h2>🌸 Nyugalom kertje</h2>
  <textarea id="gardenNote" placeholder="Mit ültettél ma a lelkedbe?"></textarea>
  <button onclick="saveGarden()">Mentés</button>
</div>

<!-- 📅 NAPTÁR -->
<div id="calendar" class="page">
  <h2>📅 Naptár (egyszerű)</h2>
  <p>Itt később napi adatokat fogunk megjeleníteni.</p>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <button onclick="show('home')">🏠</button>
  <button onclick="show('emotions')">💖</button>
  <button onclick="show('health')">💪</button>
  <button onclick="show('garden')">🌸</button>
  <button onclick="show('calendar')">📅</button>
</div>

<script>
function show(page){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}

function saveNote(){
  localStorage.setItem('note', document.getElementById('todayNote').value);
}

function saveHealth(){
  localStorage.setItem('plank', document.getElementById('plank').value);
  localStorage.setItem('water', document.getElementById('water').value);
  localStorage.setItem('sleep', document.getElementById('sleep').value);
  localStorage.setItem('diet', document.getElementById('diet').value);
}

function saveEmotions(){
  localStorage.setItem('emotion', document.getElementById('emotionNote').value);
}

function saveGarden(){
  localStorage.setItem('garden', document.getElementById('gardenNote').value);
}
</script>

</body>
</html>
